name: zone-controller-firmware CI

on:
  push:
    paths:
      - 'zone-controller-firmware/**'
  pull_request:
    paths:
      - 'zone-controller-firmware/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Run unit tests
        working-directory: zone-controller-firmware
        run: make test

      - name: Build SIL harness (compile check)
        working-directory: zone-controller-firmware
        run: make all